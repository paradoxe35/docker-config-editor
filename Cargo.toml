[package]
name = "docker-config-editor"
version = "0.1.0"
edition = "2024"
description = "Dockerfile config editor with schema-driven completion and validation"
license = "MIT"
repository = "https://github.com/yourusername/docker-config-editor"
readme = "README.md"

[dependencies]
leptos-config-editor = { version = "=0.2.5", default-features = false, features = ["schema-validation", "yaml", "json", "toml", "hcl", "xml", "search", "diff", "folding", "protect"] }
leptos = { version = "0.8.14", features = ["csr"] }
serde_json = { version = "1", features = ["preserve_order"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.leptos-config-editor]
opt-level = 2