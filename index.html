<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Config Editor Demo</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
        [hidden] { display: none !important; }
        html, body { margin: 0; background: #0b0f14; color: #e5e7eb; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
        /* The page is the window: the editor fills what the header leaves. */
        .demo {
            box-sizing: border-box;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .demo > * { flex-shrink: 0; }
        .demo__editor { flex: 1 1 0; min-height: 0; height: 100%; }
        .demo__toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
        .demo__file { font-weight: 600; font-size: 15px; margin-right: auto; }
        .demo__field { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9ca3af; }
        .demo__select, .demo__button {
            font: 12px/1.2 ui-sans-serif, system-ui, sans-serif;
            padding: 5px 10px; border-radius: 4px; cursor: pointer;
            background: #1f2937; color: #e5e7eb; border: 1px solid #374151;
        }
        .demo__actions { display: flex; gap: 8px; align-items: center; }
        .demo__settings { margin: 12px 0; padding: 10px 12px; background: #111827; border: 1px solid #374151; border-radius: 6px; }
        .demo__settings summary { cursor: pointer; font-weight: 600; font-size: 13px; }
        .demo__settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px 16px; margin-top: 10px; align-items: center; }
        .demo__settings-grid .demo__field { min-width: 0; flex-wrap: wrap; }
        .demo__settings-grid .demo__select { max-width: 100%; min-width: 0; }
        .demo__settings-grid input.demo__select { width: 110px; }
        .demo__check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #d1d5db; }
        .demo__settings-grid .demo__button { justify-self: start; }
        @media (max-width: 640px) {
            .demo { padding: 12px; }
            .demo__file { width: 100%; }
        }
    </style>
</head>
<body>
</body>
</html>
